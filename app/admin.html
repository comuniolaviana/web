<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#07130d">
  <title>Comunio Laviana · Administrador</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app-shell">
  <header class="topbar">
    <div><div class="brand">COMUNIO LAVIANA</div><h1>Administrador</h1></div>
    <a class="session-btn" href="index.html" style="text-decoration:none">App</a>
  </header>

  <div id="adminLogin" class="panel">
    <h2>Acceso administrador</h2>
    <p class="muted">Primero inicia sesión en la aplicación. Esta pantalla solo funciona con un usuario marcado como administrador.</p>
  </div>

  <main id="adminMain" class="hidden">
    <section class="panel" style="margin-bottom:12px">
      <h2>Sincronizar jugadores</h2>
      <p class="muted">Lee <b>datos.json</b> y <b>equipos.json</b> de la web y actualiza la base de la app.</p>
      <button id="syncBtn" class="primary full">Sincronizar ahora</button>
      <p id="syncMsg" class="message"></p>
    </section>

    <section class="panel">
      <h2>Días de cláusulas</h2>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
        <label style="grid-column:1/-1">Fecha<input id="dayInput" type="date"></label>
        <label>Abre<input id="openInput" type="time" value="15:00"></label>
        <label>Cierra<input id="closeInput" type="time" value="21:00"></label>
      </div>
      <label style="display:flex;grid-template-columns:auto 1fr;align-items:center;gap:8px">
        <input id="enabledInput" type="checkbox" checked style="width:auto"> Día habilitado
      </label>
      <button id="saveDayBtn" class="primary full">Guardar día</button>
      <p id="dayMsg" class="message"></p>
      <div id="daysList" style="margin-top:12px"></div>
    </section>
  </main>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="admin.js"></script>
</body>
</html>
