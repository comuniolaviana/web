<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ComunioLaviana</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #1f2937;
    }

    header {
      background: #1f6b3a;
      color: white;
      padding: 24px 16px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 32px;
    }

    header p {
      margin: 8px 0 0;
    }

    main {
      max-width: 1100px;
      margin: 30px auto;
      padding: 0 12px;
    }

    .actualizado {
      text-align: center;
      margin-bottom: 24px;
      font-size: 14px;
      color: #4b5563;
    }

    .seccion {
      background: white;
      border-radius: 14px;
      margin-bottom: 24px;
      overflow: hidden;
      box-shadow: 0 4px 14px rgba(0,0,0,0.08);
    }

    .seccion h2 {
      margin: 0;
      padding: 16px;
      background: #e8f5ec;
      color: #1f6b3a;
      font-size: 22px;
    }

    .tabla-contenedor {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 600px;
    }

    th,
    td {
      padding: 12px 14px;
      border-bottom: 1px solid #e5e7eb;
      text-align: left;
    }

    th {
      background: #f9fafb;
      font-size: 14px;
    }

    td.numero,
    th.numero {
      text-align: right;
    }

    tr:last-child td {
      border-bottom: none;
    }

    .error {
      background: #fee2e2;
      color: #991b1b;
      padding: 16px;
      border-radius: 10px;
      text-align: center;
    }


    .menu {
      display: flex;
      justify-content: center;
      gap: 10px;
      padding: 14px 12px 0;
      flex-wrap: wrap;
    }

    .menu a {
      display: inline-block;
      text-decoration: none;
      padding: 10px 16px;
      border-radius: 10px;
      font-weight: bold;
      background: white;
      color: #1f6b3a;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .menu a.activo {
      background: #1f6b3a;
      color: white;
    }


    .filtros {
      background: white;
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 22px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.08);
    }

    .filtros-grid {
      display: grid;
      grid-template-columns: 1fr 280px auto;
      gap: 12px;
      align-items: end;
    }

    .campo label {
      display: block;
      margin-bottom: 6px;
      font-size: 13px;
      font-weight: bold;
      color: #374151;
    }

    .campo input,
    .campo select {
      width: 100%;
      padding: 11px 12px;
      border: 1px solid #d1d5db;
      border-radius: 9px;
      font-size: 15px;
      background: white;
    }

    .limpiar {
      border: none;
      background: #1f6b3a;
      color: white;
      padding: 11px 15px;
      border-radius: 9px;
      font-weight: bold;
      cursor: pointer;
    }

    .resumen-filtro {
      margin-top: 12px;
      font-size: 14px;
      color: #4b5563;
    }

    .sin-resultados {
      background: #fff7d6;
      color: #7c5c00;
      padding: 16px;
      border-radius: 10px;
      text-align: center;
    }

    .contador {
      font-size: 14px;
      font-weight: normal;
      color: #4b5563;
    }


    .jugador-enlace {
      border: 0;
      background: transparent;
      color: #1f6b3a;
      font: inherit;
      font-weight: bold;
      padding: 0;
      cursor: pointer;
      text-align: left;
    }

    .jugador-enlace:hover { text-decoration: underline; }

    .modal-ficha {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: rgba(0,0,0,.72);
      padding: 16px;
      align-items: center;
      justify-content: center;
    }

    .modal-ficha.abierto { display: flex; }

    .ficha-jugador {
      width: min(430px, 100%);
      background: linear-gradient(180deg,#ffffff,#f7faf8);
      border-radius: 22px;
      overflow: hidden;
      box-shadow: 0 22px 60px rgba(0,0,0,.35);
    }

    .ficha-cabecera {
      background: linear-gradient(135deg,#174f2c,#1f6b3a);
      color: white;
      padding: 22px 18px;
      text-align: center;
    }

    .ficha-cabecera h2 { margin: 0; font-size: 28px; }
    .ficha-cabecera p { margin: 7px 0 0; }

    .ficha-cuerpo { padding: 18px; }

    .ficha-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .ficha-dato {
      background: #f9fafb;
      border: 1px solid #e5e7eb;
      border-radius: 11px;
      padding: 11px;
    }

    .ficha-dato span {
      display: block;
      font-size: 12px;
      color: #6b7280;
      margin-bottom: 4px;
    }

    .ficha-clausula {
      margin: 16px 0;
      border-radius: 14px;
      padding: 16px;
      text-align: center;
      background: #e8f5ec;
      color: #1f6b3a;
    }

    .ficha-clausula span { display: block; font-size: 13px; }
    .ficha-clausula strong { display: block; font-size: 32px; margin-top: 5px; }

    .ficha-actualizacion {
      background: #eef6ff;
      color: #1e3a8a;
      border-radius: 10px;
      padding: 11px;
      text-align: center;
      font-size: 13px;
      font-weight: bold;
    }

    .ficha-acciones {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      padding: 0 18px 18px;
    }

    .ficha-acciones button {
      border: 0;
      border-radius: 10px;
      padding: 11px;
      font-weight: bold;
      cursor: pointer;
    }

    .ficha-copiar { background: #1f6b3a; color: white; }
    .ficha-cerrar { background: #eef2f7; color: #374151; }

    @media (max-width: 700px) {
      header h1 {
        font-size: 26px;
      }

      th,
      td {
        padding: 10px;
        font-size: 14px;
      }

      .seccion h2 {
        font-size: 19px;
      }

      .filtros-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

  <header>
    <h1>⚽ COMUNIOLAVIANA</h1>
    <p>Cláusulas de rescisión</p>
  </header>

  <nav class="menu">
    <a class="activo" href="index.html">⚽ Cláusulas</a>
    <a href="normas.html">📜 Normas</a>
    <a href="clausulas-reglamento.html">📅 Reglamento cláusulas</a>
    <a href="copa.html">🏆 Copa</a>
    <a href="palmares.html">👑 Palmarés</a>
    <a href="estadisticas.html">📊 Estadísticas</a>
  </nav>

<main>
    <div id="actualizado" class="actualizado">
      Cargando datos...
    </div>


    <section class="filtros">
      <div class="filtros-grid">
        <div class="campo">
          <label for="buscar">🔍 Buscar jugador o propietario</label>
          <input id="buscar" type="search" placeholder="Ej.: Nico Williams o Enol">
        </div>

        <div class="campo">
          <label for="propietario">👤 Filtrar por propietario</label>
          <select id="propietario">
            <option value="">Todos los propietarios</option>
          </select>
        </div>

        <button id="limpiar" class="limpiar" type="button">Limpiar</button>
      </div>

      <div id="resumenFiltro" class="resumen-filtro"></div>
    </section>

    <div id="contenido"></div>
  </main>


  <div id="modalFicha" class="modal-ficha" aria-hidden="true">
    <article class="ficha-jugador">
      <div class="ficha-cabecera">
        <h2 id="fichaNombre"></h2>
        <p id="fichaEquipo"></p>
      </div>
      <div class="ficha-cuerpo">
        <div class="ficha-grid">
          <div class="ficha-dato"><span>Propietario</span><strong id="fichaPropietario"></strong></div>
          <div class="ficha-dato"><span>Posición</span><strong id="fichaPosicion"></strong></div>
          <div class="ficha-dato"><span>Valor actual</span><strong id="fichaValor"></strong></div>
          <div class="ficha-dato"><span>Puntos</span><strong id="fichaPuntos"></strong></div>
        </div>
        <div class="ficha-clausula">
          <span>CLÁUSULA DE RESCISIÓN</span>
          <strong id="fichaClausula"></strong>
        </div>
        <div id="fichaActualizacion" class="ficha-actualizacion"></div>
      </div>
      <div class="ficha-acciones">
        <button id="copiarFicha" class="ficha-copiar" type="button">Copiar datos</button>
        <button id="cerrarFicha" class="ficha-cerrar" type="button">Cerrar</button>
      </div>
    </article>
  </div>

  <script>
    const posiciones = [
      { clave: "porteros", titulo: "🧤 Porteros" },
      { clave: "defensas", titulo: "🛡 Defensas" },
      { clave: "medios", titulo: "🎯 Medios" },
      { clave: "delanteros", titulo: "⚽ Delanteros" }
    ];

    let datosLiga = null;

    function normalizar(texto) {
      return String(texto || "")
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .toLowerCase()
        .trim();
    }

    function formatearNumero(numero) {
      return new Intl.NumberFormat("es-ES").format(numero);
    }

    function escaparHTML(texto) {
      return String(texto)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function crearTabla(titulo, jugadores) {
      const filas = jugadores.map(jugador => `
        <tr>
          <td>
            <button
              class="jugador-enlace"
              type="button"
              data-jugador="${encodeURIComponent(JSON.stringify(jugador))}"
            >${escaparHTML(jugador.jugador)}</button>
          </td>
          <td>${escaparHTML(jugador.propietario)}</td>
          <td class="numero">${formatearNumero(jugador.clausula)} €</td>
          <td class="numero">${formatearNumero(jugador.puntos)}</td>
        </tr>
      `).join("");

      return `
        <section class="seccion">
          <h2>${titulo} <span class="contador">(${jugadores.length})</span></h2>
          <div class="tabla-contenedor">
            <table>
              <thead>
                <tr>
                  <th>Jugador</th>
                  <th>Propietario</th>
                  <th class="numero">Cláusula</th>
                  <th class="numero">Puntos</th>
                </tr>
              </thead>
              <tbody>${filas}</tbody>
            </table>
          </div>
        </section>
      `;
    }

    function cargarPropietarios(datos) {
      const propietarios = new Set();

      posiciones.forEach(posicion => {
        (datos[posicion.clave] || []).forEach(jugador => {
          if (jugador.propietario) propietarios.add(jugador.propietario);
        });
      });

      const select = document.getElementById("propietario");

      [...propietarios]
        .sort((a, b) => a.localeCompare(b, "es", { sensitivity: "base" }))
        .forEach(nombre => {
          const opcion = document.createElement("option");
          opcion.value = nombre;
          opcion.textContent = nombre;
          select.appendChild(opcion);
        });
    }

    function renderizar() {
      if (!datosLiga) return;

      const texto = normalizar(document.getElementById("buscar").value);
      const propietarioSeleccionado = document.getElementById("propietario").value;
      let total = 0;
      let bloques = "";

      posiciones.forEach(posicion => {
        const filtrados = (datosLiga[posicion.clave] || []).filter(jugador => {
          const coincideTexto =
            !texto ||
            normalizar(jugador.jugador).includes(texto) ||
            normalizar(jugador.propietario).includes(texto);

          const coincidePropietario =
            !propietarioSeleccionado ||
            jugador.propietario === propietarioSeleccionado;

          return coincideTexto && coincidePropietario;
        });

        if (filtrados.length > 0) {
          total += filtrados.length;
          bloques += crearTabla(posicion.titulo, filtrados);
        }
      });

      document.getElementById("contenido").innerHTML =
        bloques || `<div class="sin-resultados">No hay jugadores que coincidan con los filtros.</div>`;

      let mensaje = `${total} jugador${total === 1 ? "" : "es"} mostrado${total === 1 ? "" : "s"}.`;

      if (propietarioSeleccionado) {
        mensaje += ` Propietario: ${propietarioSeleccionado}.`;
      }

      document.getElementById("resumenFiltro").textContent = mensaje;
    }

    document.getElementById("buscar").addEventListener("input", renderizar);
    document.getElementById("propietario").addEventListener("change", renderizar);

    document.getElementById("limpiar").addEventListener("click", () => {
      document.getElementById("buscar").value = "";
      document.getElementById("propietario").value = "";
      renderizar();
    });


    let jugadorFichaActivo = null;

    function nombrePosicion(posicion) {
      return String(posicion || "")
        .replace(/^1\./, "")
        .replace(/^2\./, "")
        .replace(/^3\./, "")
        .replace(/^4\./, "");
    }

    function abrirFicha(jugador) {
      jugadorFichaActivo = jugador;
      document.getElementById("fichaNombre").textContent = jugador.jugador || "Jugador";
      document.getElementById("fichaEquipo").textContent = jugador.equipo || "Equipo no disponible";
      document.getElementById("fichaPropietario").textContent = jugador.propietario || "—";
      document.getElementById("fichaPosicion").textContent = nombrePosicion(jugador.posicion) || "—";
      document.getElementById("fichaValor").textContent = `${formatearNumero(jugador.valor || 0)} €`;
      document.getElementById("fichaPuntos").textContent = formatearNumero(jugador.puntos || 0);
      document.getElementById("fichaClausula").textContent = `${formatearNumero(jugador.clausula || 0)} €`;
      document.getElementById("fichaActualizacion").textContent = `Última actualización: ${datosLiga.actualizado}`;

      const modal = document.getElementById("modalFicha");
      modal.classList.add("abierto");
      modal.setAttribute("aria-hidden", "false");
    }

    function cerrarFicha() {
      const modal = document.getElementById("modalFicha");
      modal.classList.remove("abierto");
      modal.setAttribute("aria-hidden", "true");
    }

    document.addEventListener("click", evento => {
      const boton = evento.target.closest(".jugador-enlace");
      if (!boton) return;
      abrirFicha(JSON.parse(decodeURIComponent(boton.dataset.jugador)));
    });

    document.getElementById("cerrarFicha").addEventListener("click", cerrarFicha);

    document.getElementById("modalFicha").addEventListener("click", evento => {
      if (evento.target.id === "modalFicha") cerrarFicha();
    });

    document.getElementById("copiarFicha").addEventListener("click", async () => {
      if (!jugadorFichaActivo) return;

      const texto = [
        `⚽ ${jugadorFichaActivo.jugador}`,
        `Equipo: ${jugadorFichaActivo.equipo || "—"}`,
        `Propietario: ${jugadorFichaActivo.propietario || "—"}`,
        `Posición: ${nombrePosicion(jugadorFichaActivo.posicion) || "—"}`,
        `Valor: ${formatearNumero(jugadorFichaActivo.valor || 0)} €`,
        `Cláusula: ${formatearNumero(jugadorFichaActivo.clausula || 0)} €`,
        `Puntos: ${formatearNumero(jugadorFichaActivo.puntos || 0)}`,
        `Última actualización: ${datosLiga.actualizado}`
      ].join("\n");

      try {
        await navigator.clipboard.writeText(texto);
        const boton = document.getElementById("copiarFicha");
        boton.textContent = "Copiado";
        setTimeout(() => boton.textContent = "Copiar datos", 1500);
      } catch (error) {
        alert(texto);
      }
    });


    fetch("datos.json?v=" + Date.now())
      .then(respuesta => {
        if (!respuesta.ok) {
          throw new Error("No se pudo cargar datos.json");
        }
        return respuesta.json();
      })
      .then(datos => {
        datosLiga = datos;

        document.getElementById("actualizado").textContent =
          "Última actualización: " + datos.actualizado;

        cargarPropietarios(datos);
        renderizar();
      })
      .catch(error => {
        document.getElementById("actualizado").textContent = "";

        document.getElementById("contenido").innerHTML = `
          <div class="error">
            Todavía no se ha subido el archivo datos.json.
          </div>
        `;

        console.error(error);
      });
  </script>

</body>
</html>
