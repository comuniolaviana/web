name: Descargar datos Comuniazo corregido
on:
  push:
    branches: [main, experimento-datos-comunio-oficial]
    paths: ['.github/workflows/prueba-comunio-oficial.yml']
  workflow_dispatch:
  schedule:
    - cron: '25 7 * * *'
permissions:
  contents: write
jobs:
  descarga:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: true
      - run: python -m pip -q install beautifulsoup4
      - run: python experimentos/descargar_comuniazo.py
