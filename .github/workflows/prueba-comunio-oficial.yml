name: Inspeccion oficial Comunio
on:
  push:
    branches: [experimento-datos-comunio-oficial]
    paths: ['.github/workflows/prueba-comunio-oficial.yml']
jobs:
  inspeccionar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspeccionar HTML y rutas de datos
        run: |
          python - <<'PY'
          import urllib.request,re,html
          urls=["https://stats.comunio.es/search.php?lang=es","https://stats.comunio.es/search.php?direc=DESC&endGd=10&orderBy=points&pos%5B%5D=a&season=2026&startGd=1&startLimit=100"]
          for u in urls:
            print("URL",u)
            try:
              r=urllib.request.urlopen(urllib.request.Request(u,headers={"User-Agent":"Mozilla/5.0"}),timeout=15)
              t=r.read(500000).decode("utf-8","replace")
              print("STATUS",r.status,"LEN",len(t))
              print("TITLE",re.findall(r"<title[^>]*>(.*?)</title>",t,re.I|re.S)[:1])
              print("SCRIPTS",re.findall(r"<script[^>]+src=[\x22\x27]([^\x22\x27]+)",t,re.I)[:25])
              print("FORMS",re.findall(r"<form[^>]*>",t,re.I)[:8])
              print("TABLES",len(re.findall(r"<table",t,re.I)),"TR",len(re.findall(r"<tr",t,re.I)))
              print("TEXT",re.sub(r"\s+"," ",re.sub(r"<[^>]+>"," ",t))[:1100])
              print("KEYWORDS",[(k,len(re.findall(k,t,re.I))) for k in ["Carlos Romero","player","points","market","ajax","json","Spieler","Punkte"]])
            except Exception as e:print("ERROR",repr(e))
          PY
