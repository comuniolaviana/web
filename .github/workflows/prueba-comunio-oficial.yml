name: Extraccion experimental valores y puntos
on:
  push:
    branches: [experimento-datos-comunio-oficial]
    paths: ['.github/workflows/prueba-comunio-oficial.yml']
jobs:
  extraer:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Descargar tabla oficial y mostrar filas de prueba
        run: |
          python -m pip -q install beautifulsoup4
          python - <<'PY'
          import urllib.request
          from bs4 import BeautifulSoup
          u="https://stats.comunio.es/search.php?lang=es&direc=DESC&endGd=10&orderBy=points&season=2026&startGd=1&startLimit=0"
          t=urllib.request.urlopen(urllib.request.Request(u,headers={"User-Agent":"Mozilla/5.0"}),timeout=20).read().decode("utf-8","replace")
          s=BeautifulSoup(t,"html.parser")
          for i,table in enumerate(s.find_all("table")):
            rows=table.find_all("tr")
            if len(rows)>3:
              print("TABLA",i,"FILAS",len(rows))
              for row in rows[:5]:
                print("CELDAS",[x.get_text(" ",strip=True)[:95] for x in row.find_all(["th","td"])])
          print("PAGINACION",[a.get("href") for a in s.find_all("a",href=True) if "startLimit" in a.get("href","")][:12])
          PY
