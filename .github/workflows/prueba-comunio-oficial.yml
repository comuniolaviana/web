name: Inspeccionar HTML ficha 2627
on:
  push:
    branches: [main, experimento-datos-comunio-oficial]
    paths: ['.github/workflows/prueba-comunio-oficial.yml']
  workflow_dispatch:
  schedule:
    - cron: '25 7 * * *'
permissions:
  contents: write
jobs:
  descarga:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: true
      - run: python -m pip -q install beautifulsoup4
      - run: python experimentos/html_ficha_2627.py
      - name: Guardar descarga experimental
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add datos-comuniazo-prueba/ultimo.json
          git diff --cached --quiet || (git commit -m "Guardar prueba Comuniazo" && git push)
