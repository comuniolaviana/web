name: Descargar datos oficiales corregidos
on:
  push:
    branches: [experimento-datos-comunio-oficial]
    paths: ['.github/workflows/prueba-comunio-oficial.yml']
jobs:
  descarga:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip -q install beautifulsoup4
      - run: python experimentos/descargar_comunio.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: datos-comunio-corregidos
          path: datos-comunio-prueba/*.csv
          if-no-files-found: warn
